# Environnement de DEV : code bind-monté (hot reload front & back), ports
# exposés sur l'hôte, Adminer activé. Voir docker-compose.prod.yml pour la
# prod (images figées, pas de volumes de code, pas d'Adminer).
#
# Toutes les valeurs viennent du fichier .env à la racine (copié depuis
# .env.docker.example). La syntaxe ${VAR:?...} fait échouer `docker compose`
# si une variable manque, au lieu de démarrer en silence avec une chaîne vide
# (qui masquerait aussi back/.env côté Symfony).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?absent de .env (voir .env.docker.example)}
      MYSQL_USER: ${MYSQL_USER:?absent de .env (voir .env.docker.example)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?absent de .env (voir .env.docker.example)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?absent de .env (voir .env.docker.example)}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Dump importé par l'image mysql au PREMIER démarrage uniquement (volume
      # mysql_data vide), dans la base MYSQL_DATABASE. Il contient déjà la table
      # doctrine_migration_versions : les migrations de l'entrypoint du back
      # n'ont donc rien à rejouer ensuite. Pour réimporter : `docker compose down -v`.
      - ./taskmanager.sql:/docker-entrypoint-initdb.d/01-taskmanager.sql:ro
    healthcheck:
      # -h 127.0.0.1 force le TCP : pendant l'import initial, MySQL tourne en
      # --skip-networking et ne doit pas encore être vu comme "healthy".
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  back:
    build:
      context: ./back
      target: dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:?absent de .env (voir .env.docker.example)}
      # Hôte = "mysql" (nom du service), jamais localhost/127.0.0.1 depuis un conteneur.
      DATABASE_URL: ${DATABASE_URL:?absent de .env (voir .env.docker.example)}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?absent de .env (voir .env.docker.example)}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?absent de .env (voir .env.docker.example)}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?absent de .env (voir .env.docker.example)}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-2592000}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?absent de .env (voir .env.docker.example)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8000}
      MAILER_DSN: ${MAILER_DSN:-null://null}
    volumes:
      - ./back:/var/www/html
      # Volume nommé sur vendor/ : évite qu'un bind-mount sans vendor/ (clone
      # frais) masque celui installé dans l'image. Docker le pré-remplit avec
      # le contenu de l'image au premier démarrage.
      - back_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./back:/var/www/html:ro
      - ./back/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BACK_HTTP_PORT:-8000}:80"
    depends_on:
      back:
        condition: service_healthy

  front:
    build:
      context: ./front
      target: dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?absent de .env (voir .env.docker.example)}
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://nginx}
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - back

  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
  back_vendor:
  front_node_modules:
  front_next_cache:
