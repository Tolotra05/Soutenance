# Environnement de DEV : code bind-monté (hot reload front & back), ports
# exposés sur l'hôte, Adminer activé. Voir docker-compose.prod.yml pour la
# prod (images figées, pas de volumes de code, pas d'Adminer).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  back:
    build:
      context: ./back
      target: dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      DEFAULT_URI: ${DEFAULT_URI}
      MAILER_DSN: ${MAILER_DSN}
    volumes:
      - ./back:/var/www/html
      # Volume nommé sur vendor/ : évite qu'un bind-mount sans vendor/ (clone
      # frais) masque celui installé dans l'image. Docker le pré-remplit avec
      # le contenu de l'image au premier démarrage.
      - back_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./back:/var/www/html:ro
      - ./back/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BACK_HTTP_PORT:-8000}:80"
    depends_on:
      back:
        condition: service_healthy

  front:
    build:
      context: ./front
      target: dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_URL_INTERNAL: ${API_URL_INTERNAL}
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - back

  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
  back_vendor:
  front_node_modules:
  front_next_cache:
