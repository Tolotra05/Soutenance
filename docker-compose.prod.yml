# Environnement de PROD : images buildées (pas de volumes de code), MySQL non
# exposé sur l'hôte, pas d'Adminer. Lancer avec :
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?absent de .env (voir .env.docker.example)}
      MYSQL_USER: ${MYSQL_USER:?absent de .env (voir .env.docker.example)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?absent de .env (voir .env.docker.example)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?absent de .env (voir .env.docker.example)}
    # Pas de `ports:` : seuls les conteneurs du réseau interne doivent
    # atteindre MySQL, pas l'hôte ni l'extérieur.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 force le TCP (pas "healthy" pendant l'init en --skip-networking),
      # $$ = mot de passe lu dans le conteneur, pas écrit en clair dans la config.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  back:
    build:
      context: ./back
      target: prod
    image: ${REGISTRY:-taskmanager}/back:${TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?absent de .env (voir .env.docker.example)}
      DATABASE_URL: ${DATABASE_URL:?absent de .env (voir .env.docker.example)}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?absent de .env (voir .env.docker.example)}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?absent de .env (voir .env.docker.example)}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?absent de .env (voir .env.docker.example)}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-2592000}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?absent de .env (voir .env.docker.example)}
      FRONTEND_URL: ${FRONTEND_URL:?absent de .env (voir .env.docker.example)}
      DEFAULT_URI: ${DEFAULT_URI:?absent de .env (voir .env.docker.example)}
      # Vrai SMTP en prod (null://null = aucun e-mail envoyé, échec silencieux).
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-no-reply@taskmanager.local}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
    volumes:
      # Les clés JWT sont générées une seule fois (au tout premier démarrage)
      # par l'entrypoint puis doivent survivre aux recréations du conteneur :
      # sans ça, chaque déploiement invaliderait tous les tokens existants.
      - jwt_keys:/var/www/html/config/jwt
      - uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Point d'entrée unique (URL publique) : /api, /uploads -> Symfony ; tout le
  # reste -> Next.js. Voir back/docker/nginx/default.conf.
  nginx:
    build:
      context: ./back
      target: nginx-prod
    image: ${REGISTRY:-taskmanager}/nginx:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Fichiers écrits par le back (FileUploadService) : servis directement
      # par nginx, qui n'a sinon que le public/ figé au build de l'image.
      - uploads:/var/www/html/public/uploads:ro
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_started

  front:
    build:
      context: ./front
      target: runner
      args:
        # Vide = appels relatifs (/api/...) : la même image marche quelle que
        # soit l'IP du serveur (aucun rebuild quand elle change).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: ${REGISTRY:-taskmanager}/front:${TAG:-latest}
    restart: unless-stopped
    # Pas de `ports:` : joint uniquement à travers nginx.
    depends_on:
      - back

volumes:
  mysql_data:
  jwt_keys:
  uploads:
