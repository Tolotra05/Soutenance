; Chargé uniquement par le stage "prod" du Dockerfile, après zz-app.ini.
; Le code est copié dans l'image au build (pas de bind-mount en prod) et ne
; change donc jamais pendant que le conteneur tourne : inutile de vérifier
; les mtime à chaque requête, ce qui gagne quelques % de latence.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
