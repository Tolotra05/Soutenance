; Limites mémoire / upload ---------------------------------------------
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

; Fuseau horaire ----------------------------------------------------------
date.timezone = Europe/Paris

; OPcache -----------------------------------------------------------------
; validate_timestamps=1 : revérifie le mtime des fichiers à chaque requête,
; donc voit immédiatement les changements de code. Indispensable en dev
; (bind-mount + hot reload) ; overhead négligeable, donc gardé par défaut ici
; aussi. docker/php/opcache-prod.ini (chargé uniquement par le stage "prod"
; du Dockerfile) le désactive, le code étant immuable une fois l'image buildée.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1

; Erreurs -----------------------------------------------------------------
; display_errors=Off même en dev : les erreurs Symfony passent par son
; propre gestionnaire d'erreurs (page de debug), pas par celui de PHP.
display_errors = Off
log_errors = On
