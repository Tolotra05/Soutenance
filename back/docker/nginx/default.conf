# Single public entry point: front and API share one origin (e.g.
# http://192.168.88.236/), so the browser never makes cross-origin calls.
#   /api/*, /uploads/*, /bundles/*  -> Symfony (php-fpm) / its public/ dir
#   everything else                 -> Next.js (pages, /_next assets, dev HMR websocket)

# Websocket upgrade for Next.js dev hot reload (/_next/webpack-hmr).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 20m;

    # Resolve "front" lazily through Docker's DNS: nginx still starts (and the
    # API stays up) while the front container is restarting or rebuilding.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $front_upstream http://front:3000;

    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Files written by FileUploadService (public/uploads) and bundle assets.
    location /uploads/ {
        try_files $uri =404;
    }

    location /bundles/ {
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass back:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # Anything else ending in .php doesn't exist as a routed front controller.
    location ~ \.php$ {
        return 404;
    }

    location / {
        proxy_pass $front_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_log /var/log/nginx/back_error.log;
    access_log /var/log/nginx/back_access.log;
}
