# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    frontend_url: '%env(string:FRONTEND_URL)%'

    # Valeurs par défaut si la variable d'environnement est absente
    # (ex. lancement hors Docker) -- voir AccountNotificationMailer.
    env(MAILER_DSN): 'null://null'
    env(MAILER_FROM): 'no-reply@taskmanager.local'
    env(ADMIN_NOTIFY_EMAIL): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'